<!doctype html>
<html>
  <head>
    <title>Loader</title>
  </head>
  <body>
    <h2>Tracking pixel loader</h2>
    <div id="displayOriginContainer"></div>
    <div id="redirectMessage"></div>
    <script>
      const urlParams = new URLSearchParams(location.search);
      let utm_source = urlParams.get("utm_source") || "";
      window.utm_source = utm_source;

      // DOM XSS via displayOrigin
      const displayOrigin = urlParams.get("displayOrigin");
      if (displayOrigin) {
        document.getElementById("displayOriginContainer").innerHTML =
          displayOrigin;
      }

      // Open redirect
      const origin = urlParams.get("origin");
      const timeout = parseInt(urlParams.get("timeoutDuration")) || 0;
      if (origin) {
        document.getElementById("redirectMessage").innerText =
          `Redirecting to ${origin} in ${timeout}ms`;
        setTimeout(() => {
          let redirectUrl = origin;
          const encodedUtm = encodeURIComponent(window.utm_source || "");
          if (encodedUtm)
            redirectUrl +=
              (redirectUrl.includes("?") ? "&" : "?") +
              `utm_source=${encodedUtm}`;
          location.href = redirectUrl;
        }, timeout);
      }
    </script>
  </body>
</html>
