<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting | Northstar Store</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="loader-wrap site-shell">
      <section class="loader-card">
        <a href="/" class="inline-note">← Back to store</a>
        <div class="loader-brand">
          <span class="brand-mark small">N</span>
          <strong>Northstar Store</strong>
        </div>
        <div class="loader-spinner" aria-hidden="true"></div>
        <h2>Preparing your next page</h2>
        <p>
          We are keeping your shopping session together and sending you to the
          selected destination.
        </p>

        <div class="loader-route">
          <p id="redirect-message"></p>
          <p id="redirect-destination"></p>
        </div>

        <div class="loader-progress" aria-hidden="true"><span></span></div>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);

      const next = params.get("next") || "/";
      const bannerText = params.get("bannerText") || next;
      const timeoutDuration = parseInt(
        params.get("timeoutDuration") || "3000",
        10,
      );

      var utm_source = "localhost:3000";

      // Intentionally vulnerable for demo purposes:
      document.getElementById("redirect-message").innerHTML =
        `You are being redirected to <strong>${bannerText}</strong>.`;

      document.getElementById("redirect-destination").innerHTML =
        `Destination: ${next}`;

      setTimeout(
        () => {
          window.location.href = next + "?utm_source=" + utm_source;
        },
        Number.isNaN(timeoutDuration) ? 3000 : timeoutDuration,
      );
    </script>
  </body>
</html>
