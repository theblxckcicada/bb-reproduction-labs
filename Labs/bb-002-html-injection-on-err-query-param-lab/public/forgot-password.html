<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset password | CloudDesk</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <main class="simple-page">
    <section class="simple-card">
      <a class="brand" href="/signin">
        <span class="brand-mark">C</span>
        <span>CloudDesk</span>
      </a>

      <div class="auth-heading">
        <p class="eyebrow">Account recovery</p>
        <h2>Reset your password</h2>
        <p>Enter your email address and we’ll send recovery instructions if the account exists.</p>
      </div>

      <div id="messageBox" class="message-box info" hidden></div>

      <form class="form" method="post" action="/recover">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="name@company.com" required>
        <button type="submit">Send recovery link</button>
      </form>

      <p class="signup-note">
        Remembered your password?
        <a href="/signin">Back to sign in</a>
      </p>
    </section>
  </main>

  <script src="/assets/app.js"></script>
</body>
</html>
