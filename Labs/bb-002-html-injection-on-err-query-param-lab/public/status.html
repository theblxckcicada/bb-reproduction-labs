<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Status | CloudDesk</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <main class="simple-page">
    <section class="simple-card">
      <a class="brand" href="/signin">
        <span class="brand-mark">C</span>
        <span>CloudDesk</span>
      </a>
      <div class="auth-heading">
        <p class="eyebrow">System status</p>
        <h2>All systems operational</h2>
        <p>Current service availability across CloudDesk workspaces.</p>
      </div>

      <div class="status-list">
        <div><span class="dot success"></span><strong>Authentication</strong><small>Operational</small></div>
        <div><span class="dot success"></span><strong>Request workflows</strong><small>Operational</small></div>
        <div><span class="dot success"></span><strong>Notifications</strong><small>Operational</small></div>
      </div>
    </section>
  </main>
</body>
</html>
